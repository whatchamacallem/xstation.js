The shell of the headless page of group B: the head and the scripts of
test.html in their order, the last one opening the realm lane through
test_headless in place of running test_all, and no pre for the TAP stream,
which the realm sends to the driver. page_build.py replaces each build
marker.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>hyperposition-engine tests</title>
    <style>
      XSJS_BUILD_ENGINE_CSS
    </style>
    <style>
      XSJS_BUILD_XTERM_CSS
    </style>
    <style>
      /* A failed line of the TAP stream, and its diagnostics, in red. */
      .failed {
        color: red;
      }
    </style>
  </head>
  <body>
    <!-- The AI worker runs the text of each `data-worker` script in order. -->
    <script data-worker>
      var test_vectors = XSJS_BUILD_TEST_VECTORS;
    </script>
    <script data-worker>
      XSJS_BUILD_BUNDLE;
    </script>
    <script type="text/plain" data-worker>
      var sqlite3_wasm_base64 = "XSJS_BUILD_SQLITE3_WASM";
    </script>
    <script type="text/plain" data-worker>
      XSJS_BUILD_SQLITE3_JS
    </script>
    <script>
      XSJS_BUILD_XTERM_JS;
    </script>
    <script data-worker>
      test_headless.realm_open();
    </script>
  </body>
</html>
