The shell of the ttyd test page: engine.css, xterm.css, the test bundle
with test_vectors and test_gold, SQLite's wasm and glue, xterm.js and a pre
for the TAP stream. page_build.py replaces each build marker.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>hyperposition-engine tests</title>
    <!-- An icon of its own, so that Chrome asks no server for /favicon.ico. -->
    <link rel="icon" href="data:," />
    <style>
      XSJS_BUILD_ENGINE_CSS
    </style>
    <style>
      XSJS_BUILD_XTERM_CSS
    </style>
    <style>
      /* A failed line of the TAP stream, and its diagnostics, in red. */
      .failed {
        color: red;
      }
    </style>
  </head>
  <body>
    <pre id="tap_output"></pre>
    <!-- The AI worker runs the text of each `data-worker` script in order. -->
    <script data-worker>
      var test_vectors = XSJS_BUILD_TEST_VECTORS;
    </script>
    <script data-worker>
      var test_gold = XSJS_BUILD_TEST_GOLD;
    </script>
    <script data-worker>
      XSJS_BUILD_BUNDLE;
    </script>
    <script type="text/plain" data-worker>
      var sqlite3_wasm_base64 = "XSJS_BUILD_SQLITE3_WASM";
    </script>
    <script type="text/plain" data-worker>
      XSJS_BUILD_SQLITE3_JS
    </script>
    <script>
      XSJS_BUILD_XTERM_JS;
    </script>
    <script data-worker>
      test_all.suites_run();
    </script>
  </body>
</html>
