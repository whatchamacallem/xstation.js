<html lang="en">
<head>
<meta charset="utf-8">
<title>hyperposition-engine test engine</title>
<style>XSJS_BUILD_ENGINE_CSS</style>
<style>XSJS_BUILD_XTERM_CSS</style>
</head>
<body>
<!-- The AI worker runs the text of each `data-worker` script, in order. -->
<script data-worker>var test_vectors = XSJS_BUILD_TEST_VECTORS;</script>
<script data-worker>XSJS_BUILD_BUNDLE</script>
<script type="text/plain" data-worker>
var sqlite3_wasm_base64 = "XSJS_BUILD_SQLITE3_WASM";
</script>
<script type="text/plain" data-worker>XSJS_BUILD_SQLITE3_JS</script>
<script>XSJS_BUILD_XTERM_JS</script>
<script data-worker>test_hook.engine_run();</script>
</body>
</html>
